name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Motor de análise e build do app
        working-directory: ui
        run: |
          npm ci
          npm test
          npm run build
      - name: Banco de demonstração
        run: docker compose up -d --wait
      - name: Vet
        run: go vet ./cmd/... ./internal/...
      - name: Servidor e modo ao vivo, com detector de corridas
        run: go test -race ./cmd/... ./internal/...
